name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'marekabaffy/kotlin-noop'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # This job holds the signing key, so it must not restore caches that other branches can write.
          cache-disabled: true

      - name: Check the tag
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "'$VERSION' is not a release version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tag must point to a commit on main"
            exit 1
          fi
      - name: Extract the release notes
        run: .github/scripts/release-notes.sh "$VERSION" > release-notes.md

      - run: ./gradlew build "-PVERSION_NAME=$VERSION"

      - name: Publish signed jars to the integration test repository
        run: ./gradlew publishAllPublicationsToIntegrationTestRepository "-PVERSION_NAME=$VERSION"
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - name: Check the published files
        run: .github/scripts/check-artifacts.sh build/integration-test-repo "$VERSION"
      # Each version loads its own compiler and KSP, which overflows metaspace in a shared daemon.
      - name: Test on current versions
        run: ./gradlew -p integration-test build "-PVERSION_NAME=$VERSION" --no-daemon
      - name: Test on the oldest supported versions
        run: ./gradlew -p integration-test build "-PVERSION_NAME=$VERSION" -PkotlinVersion=2.2.21 -PkspVersion=2.3.12 --no-daemon

      # publishToMavenCentral stops at validation, and someone then clicks Publish in the Central Portal.
      # To release without that step, use publishAndReleaseToMavenCentral.
      - name: Upload to Maven Central
        run: ./gradlew publishToMavenCentral "-PVERSION_NAME=$VERSION"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Create a draft GitHub Release
        run: gh release create "$VERSION" --draft --verify-tag --title "$VERSION" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
