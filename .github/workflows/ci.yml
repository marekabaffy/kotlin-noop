name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: ./gradlew build --warning-mode fail

  integration-test:
    name: integration-test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: current versions
            versions: ""
          - name: oldest supported versions
            versions: -PkotlinVersion=2.2.21 -PkspVersion=2.3.12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: ./gradlew publishAllPublicationsToIntegrationTestRepository
      - run: ./gradlew -p integration-test build --configuration-cache ${{ matrix.versions }}
      - name: Check that the configuration cache is reused
        run: ./gradlew -p integration-test build --configuration-cache ${{ matrix.versions }} | tee reuse.log && grep "Reusing configuration cache" reuse.log
      - name: Check that KSP older than the minimum gets a clear error
        if: matrix.name == 'oldest supported versions'
        run: |
          if ./gradlew -p integration-test build -PkotlinVersion=2.2.21 -PkspVersion=2.3.11 > ksp.log 2>&1; then
            echo "The build passed on an unsupported KSP version"
            exit 1
          fi
          grep "@NoOp requires KSP 2.3.12 or newer" ksp.log
